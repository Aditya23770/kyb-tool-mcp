name: Deploy MCP

# Deploys the hosted connector to Google Cloud Run. Runs only from main (plus a nightly rebuild that
# refreshes the OFAC and UN lists baked into the image) or when started by hand.
# Credentials come from Workload Identity Federation; no keys are stored in the repo.

on:
  push:
    branches: [main]
    paths: ["src/**", "Dockerfile", ".dockerignore", "pyproject.toml", "uv.lock", ".github/workflows/deploy-mcp.yml"]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-mcp
  cancel-in-progress: false

env:
  SERVICE: trustledger-mcp
  REGION: europe-west1

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "$SERVICE" \
            --source . \
            --region "$REGION" \
            --min-instances 0 --max-instances 1 \
            --memory 512Mi --cpu 1 --timeout 120 \
            --allow-unauthenticated \
            --update-env-vars "KYB_GCP_PROJECT=${{ secrets.GCP_PROJECT_ID }}" \
            --quiet
      - name: Health check
        run: |
          URL=$(gcloud run services describe "$SERVICE" --region "$REGION" --format='value(status.url)')
          curl --fail --silent --show-error --retry 5 --retry-delay 5 "$URL/healthz"
