name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pytest -q --cov --cov-report=term --cov-fail-under=85

  package:
    # Build the wheel and prove the MCP server starts from a clean environment.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv build
      - name: Smoke test the built wheel
        run: |
          uv venv /tmp/smoke
          uv pip install --python /tmp/smoke/bin/python dist/*.whl
          /tmp/smoke/bin/kyb-tool-mcp --version
          /tmp/smoke/bin/python - <<'EOF'
          import asyncio
          from mcp import Client, StdioServerParameters
          async def main():
              async with Client(StdioServerParameters(command="/tmp/smoke/bin/kyb-tool-mcp")) as c:
                  names = sorted(t.name for t in (await c.list_tools()).tools)
                  assert names == ["check_website", "explain_policy", "registry_lookup", "review_kyb_case", "screen_entity"], names
                  print("MCP tools:", names)
          asyncio.run(main())
          EOF
      - name: Smoke test hosted HTTP mode
        run: |
          /tmp/smoke/bin/kyb-tool-mcp serve --http --host 127.0.0.1 --port 8765 &
          for i in $(seq 1 30); do curl -s -o /dev/null http://127.0.0.1:8765/healthz && break; sleep 1; done
          # No sanctions index in CI, so /healthz must report it (503), not pretend to be healthy.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8765/healthz)" = "503"
          /tmp/smoke/bin/python - <<'EOF'
          import asyncio
          from mcp import Client
          async def main():
              async with Client("http://127.0.0.1:8765/mcp") as c:
                  names = sorted(t.name for t in (await c.list_tools()).tools)
                  assert names == ["check_website", "explain_policy", "registry_lookup", "review_kyb_case", "screen_entity"], names
                  print("HTTP MCP tools:", names)
          asyncio.run(main())
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  secrets:
    # Block commits that contain credentials (API keys, tokens, private keys).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
